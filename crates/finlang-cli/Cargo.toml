[package]
name = "finlang"
version = "0.1.2"
edition = "2021"
description = "Command-line interface for the FinLang financial programming language."
license = "MIT"
repository = "https://github.com/adnanomar77/finlang"

[dependencies]
finlang-core = { version = "0.1.2", path = "../.." }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
